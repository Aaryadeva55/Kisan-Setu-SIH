services:
  postgres:
    image: postgres:16-alpine
    container_name: kisan_setu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kisan_setu
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kisan_setu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
